/* ================= documents (PDF, Word, Excel, PowerPoint; RU and EN versions) ================= */
const DOC_TYPES={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'};
const DOC_ACCEPT='.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx';
function docKind(f){ const ext=(String(f.name||'').split('.').pop()||'').toLowerCase();
  if(f.type==='application/pdf'||ext==='pdf') return 'pdf';
  const byType=Object.keys(DOC_TYPES).find(k=>DOC_TYPES[k]===f.type); return byType||ext; }
const KIND_LABEL={pdf:'PDF',doc:'Word',docx:'Word',xls:'Excel',xlsx:'Excel',ppt:'PowerPoint',pptx:'PowerPoint'};
const KIND_CLASS={pdf:'k-pdf',doc:'k-doc',docx:'k-doc',xls:'k-xls',xlsx:'k-xls',ppt:'k-ppt',pptx:'k-ppt'};
const fmtSize=n=>!n?'':n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1).replace('.0','')+' MB';
const docData=(p,ph,key)=>((p[ph]||{})[key])||{};
const docFiles=d=>({ru:d.file_ru||d.file||null,en:d.file_en||null});
const hasDoc=d=>{ const f=docFiles(d); return !!(f.ru||f.en); };
function bpmnSlotHtml(p,ph){ if(!(HOST&&HOST.openModel&&HOST.caps.bpmn)||(ph!=='asis'&&ph!=='tobe')) return '';
  const l=HOST.modelSummary(p.id,ph)||[], ST={draft:t('Черновик'),review:t('На согласовании'),approved:t('Утверждена'),archived:t('В архиве')};
  const info=l.length?l.map(m=>`<span class="bpmn-chip st-${esc(m.status)}">${esc(m.name)} · v${m.version} · ${esc(ST[m.status]||m.status)}</span>`).join(''):`<span class="muted small">${t('Схемы ещё нет')}</span>`;
  return `<div class="bpmn-slot"><div class="bpmn-slot-i"><b>${t('Схема BPMN')}</b>${info}</div><button type="button" class="btn ${l.length||!HOST.caps.bpmnEdit?'ghost':'primary'} sm" data-act="bpmn-open" data-v="${ph}">${!l.length&&HOST.caps.bpmnEdit?t('+ Нарисовать схему'):t('Открыть редактор схем')}</button></div>`; }
function docBanner(p,ph){
  if(ph==='auto') return S.doc.auto==='appr'?'':`<div class="banner">${t('Этап «Автоматизация»: аналитик размещает BRD — требования к автоматизации процесса. BRD согласуется так же, как диаграммы AS IS и TO BE, на вкладке «Согласование».')}</div>`;
  if(ph!=='tobe'||stageOf(p)>=2||SLOTS.some(s=>hasDoc(docData(p,'tobe',s.key)))) return '';
  return `<div class="banner">${t('Целевой процесс появится здесь после разбора предложений рабочей группы.')}${S.me.canEdit?t(' Материалы TO BE можно загружать в любой момент.'):''}</div>`;
}
function docCard(f,kind,msg){
  return `<div class="file-card"><span class="kind ${KIND_CLASS[kind]||''}">${esc(KIND_LABEL[kind]||kind.toUpperCase())}</span>
    <div class="fc-main"><b>${esc(f.name||'')}</b><span class="upd">${fmtSize(f.size)}</span>${msg?`<p class="note">${msg}</p>`:''}</div>
    <div class="fc-actions"><a class="btn primary sm" href="${fileUrl(f.id)}" download="${esc(f.name||'')}">${t('Скачать')}</a></div></div>`;
}
function docsHtmlBase(p,ph){
  const SL=slotsOf(ph); let sel=S.doc[ph]||SL[0].key; if(sel==='res'&&ph==='auto') sel=SL[0].key;
  const extra=(ph==='auto'?[]:[['res','Расчёт ресурса']]).concat([['appr','Согласование']]);
  const xTabs=extra.map(([k,l])=>`<button role="tab" aria-selected="${sel===k}" class="doc-tab x-tab ${sel===k?'on':''}" data-act="doc" data-v="${k}">${t(l)}${k==='appr'?apprBadge(p,ph):''}</button>`).join('');
  const docTabs=cur=>SL.map(x=>`<button role="tab" aria-selected="${x.key===cur}" class="doc-tab ${x.key===cur?'on':''} ${hasDoc(docData(p,ph,x.key))?'':'empty'}" data-act="doc" data-v="${x.key}">${t(x.title)}</button>`).join('');
  if(sel==='res'||sel==='appr') return `<div class="doc-bar"><nav class="doc-tabs" role="tablist" aria-label="${t('Документы')}">${docTabs('')}${xTabs}</nav></div><div class="doc-panel ${sel==='res'?'res-panel':'appr-panel'}">${sel==='res'?resHtml(p,ph):approvalsHtml(p,ph)}</div>`;
  const s=SL.find(x=>x.key===sel)||SL[0];
  const d=docData(p,ph,s.key); const files=docFiles(d);
  const want=S.docLang||LANG; const other=want==='ru'?'en':'ru';
  let lang=want, f=files[want], fallback=false;
  if(!f&&files[other]&&!S.me.canEdit){ f=files[other]; lang=other; fallback=true; }
  const tabs=docTabs(s.key);
  const langs=['ru','en'].map(l=>`<button type="button" class="${lang===l?'on':''}" data-act="doclang" data-v="${l}" ${files[l]?'':'data-missing="1"'} title="${t(files[l]?'Версия есть':'Версии пока нет')}">${l.toUpperCase()}</button>`).join('');
  const L2=lang.toUpperCase();
  const tools=S.me.canEdit?`<label class="btn ghost sm" for="doc-file">${t(files[lang]?'Заменить файл ({l})':'Загрузить файл ({l})',{l:L2})}</label><input type="file" id="doc-file" accept="${DOC_ACCEPT}" hidden data-up="${ph}.${s.key}.${lang}">${files[lang]?`<button class="btn ghost sm danger" data-act="doc-del" data-v="${ph}.${s.key}.${lang}">${t('Удалить')}</button>`:''}`:'';
  let view;
  if(!f) view=`<div class="doc-empty">${S.me.canEdit?t('Загрузите файл «{d}» ({l}): PDF, Word, Excel или PowerPoint.',{d:t(s.title),l:L2}):t('Документ «{d}» пока не добавлен.',{d:t(s.title)})}</div>`;
  else { const kind=docKind(f);
    if(kind==='pdf') view=`<iframe class="pdf-view" src="${fileUrl(f.id)}#view=FitH" title="${esc(t(s.title))} (${L2})"></iframe>`;
    else if(['docx','xlsx','xls','pptx'].includes(kind)) view=`<div class="office-view" data-render="${esc(f.id)}" data-kind="${kind}" data-name="${esc(f.name||'')}" data-size="${f.size||0}"><div class="doc-loading">${t('Открываю документ…')}</div></div>`;
    else view=docCard(f,kind,t('Старый формат {k} нельзя показать прямо на странице. Скачайте файл или загрузите его в формате {n} либо PDF.',{k:'.'+kind,n:kind==='doc'?'.docx':'.pptx'}));
  }
  const meta=f?`<span class="kind ${KIND_CLASS[docKind(f)]||''}">${esc(KIND_LABEL[docKind(f)]||'')}</span><span class="upd">${esc(f.name||'')}${d.updatedAt?' · '+t('обновлено')+' '+fmtDate(d.updatedAt):''}</span>`:'';
  return `<div class="doc-bar"><nav class="doc-tabs" role="tablist" aria-label="${t('Документы')}">${tabs}${xTabs}</nav></div>
    <div class="doc-panel"><div class="doc-tools"><div class="seg-toggle" role="group" aria-label="${t('Язык документа')}">${langs}</div>${meta}<span class="grow"></span>
      ${f?`<a class="btn ghost sm" href="${fileUrl(f.id)}" ${docKind(f)==='pdf'?'target="_blank" rel="noopener"':`download="${esc(f.name||'')}"`}>${t(docKind(f)==='pdf'?'Открыть на весь экран':'Скачать')}</a>`:''}${tools}</div>
      ${fallback?`<p class="note fb">${t(want==='en'?'Английской версии пока нет — показана русская.':'Русской версии пока нет — показана английская.')}</p>`:''}
      ${view}</div>`;
}
/* ================= approval of process diagrams (AS IS / TO BE) ================= */
const apprList=(p,ph)=>(((p.approvals||{})[ph])||[]);
const diagId=(p,ph)=>{ const d=docData(p,ph,ph==='auto'?'brd':'bpmn'); return ((d.file_ru||d.file||d.file_en)||{}).id||''; };
const apprTitle=ph=>ph==='auto'?t('Согласование BRD'):t('Согласование диаграммы {p}',{p:ph==='asis'?'AS IS':'TO BE'});
function apprBadge(p,ph){ const l=apprList(p,ph); if(!l.length) return ''; const ok=l.filter(x=>x.status==='approved').length; return `<span class="tab-cnt ${ok===l.length?'all':''}">${ok}/${l.length}</span>`; }
function apprSummary(p,ph){ const l=apprList(p,ph); if(!l.length) return ''; const ok=l.filter(x=>x.status==='approved').length;
  return `<span class="appr-sum ${ok===l.length?'all':''}">${ok===l.length?'✓ ':''}${t('{a} из {b}',{a:ok,b:l.length})}</span>`; }
function approvalsHtml(p,ph){

    ${l.length?`<div class="appr-wrap"><table class="appr-t"><thead><tr><th>${t('ФИО')}</th><th>${t('Статус')}</th><th>${t('Дата согласования')}</th><th>${t('Комментарий')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<p class="muted">${t(ed?(ph==='auto'?'Добавьте согласующих BRD — они отметят согласование здесь, указав ФИО и дату.':'Добавьте согласующих этой диаграммы — они отметят согласование здесь, указав ФИО и дату.'):'Согласующие пока не назначены.')}</p>`}
    ${!ap&&!ed?`<p class="note">${t('Отметить согласование может пользователь с ролью «Согласующий».')}</p>`:''}</section>`;
}

    const heights={}; X(doc,'row').forEach(r=>{ if(r.getAttribute('ht')) heights[+r.getAttribute('r')-1]=+r.getAttribute('ht')*1.333; });
    const widths=[]; X(doc,'col').forEach(c=>{ for(let i=+c.getAttribute('min');i<=+c.getAttribute('max')&&i<=200;i++) widths[i-1]=Math.round((+c.getAttribute('width')||8.43)*7+5); });
    const merges={}, covered={}; X(doc,'mergeCell').forEach(m=>{ const [a,b]=m.getAttribute('ref').split(':'); if(!b) return; const [c1,r1]=colIdx(a),[c2,r2]=colIdx(b);
      merges[r1+','+c1]={rs:r2-r1+1,cs:c2-c1+1}; for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) if(r!==r1||c!==c1) covered[r+','+c]=1; });
    const pane=X1(doc,'pane'); const fr=pane&&pane.getAttribute('state')!=='split'?+(pane.getAttribute('ySplit')||0):0, fc=pane&&pane.getAttribute('state')!=='split'?+(pane.getAttribute('xSplit')||0):0;

  }

  const show=k=>{ const sh=parsed[k]; if(!sh){ box.innerHTML=''; return; }
    const W=c=>sh.widths[c]||71; const left=[]; let acc=0; for(let c=0;c<=sh.maxC;c++){ left[c]=acc; acc+=W(c); }
    const top=[]; let accT=0; for(let r=0;r<=sh.maxR;r++){ top[r]=accT; accT+=sh.heights[r]||22; }

    const isEmpty=(r,c)=>{ const k2=r+','+c; const d=sh.data[k2]; return !sh.covered[k2]&&!sh.merges[k2]&&(!d||d.val===''); };
    for(let r=0;r<=sh.maxR;r++){ h+=`<tr style="height:${Math.round(sh.heights[r]||22)}px">`; let skipTo=-1;
      for(let c=0;c<=sh.maxC;c++){ const key=r+','+c; if(sh.covered[key]||c<=skipTo) continue; const cell=sh.data[key]||{val:'',xf:null}; const xf=cell.xf||{font:{}}; const m=sh.merges[key];
        const css=[]; if(xf.fill) css.push('background:'+xf.fill); if(xf.font.color&&xf.font.color!=='#000000') css.push('color:'+xf.font.color); if(xf.font.b) css.push('font-weight:700'); if(xf.font.i) css.push('font-style:italic');

        let span=0; if(!xf.wrap&&!m&&cell.val!==''&&!raciRe.test(cell.val)&&!xf.rot){ while(c+span+1<=sh.maxC&&isEmpty(r,c+span+1)&&(c>=sh.fc||c+span+1<sh.fc)&&String(cell.val).length*6.5>sh.widths.slice(c,c+span+1).reduce((a,w)=>a+(w||71),0)) span++; }
        if(span){ skipTo=c+span; css.push('white-space:nowrap'); } else css.push('white-space:pre-wrap');
        const stickyR=r<sh.fr, stickyC=c<sh.fc; const cls=[stickyR?'fr':'',stickyC?'fc':'',raciRe.test(cell.val)&&String(cell.val).length<=7?'raci-cell':''].filter(Boolean).join(' ');
        if(stickyR) css.push('top:'+top[r]+'px'); if(stickyC) css.push('left:'+left[c]+'px'); if((stickyR||stickyC)&&!xf.fill) css.push('background:var(--xl-bg)');
        let txt=esc(cell.val); if(cls.includes('raci-cell')) txt=String(cell.val).toUpperCase().split(/[^RACI*]+/).filter(Boolean).map(x=>x.replace('*','')).filter(Boolean).map(x=>`<b class="rc rc-${x}">${x}</b>`).join('')+(String(cell.val).includes('*')?'<sup>*</sup>':'');
        if(xf.rot===90||xf.rot===255||xf.rot>90) txt=`<span class="xl-vert">${txt}</span>`;
        h+=`<td${m?` rowspan="${m.rs}" colspan="${m.cs}"`:span?` colspan="${span+1}"`:''}${cls?` class="${cls}"`:''} style="${css.join(';')}">${txt}</td>`; }
      h+='</tr>'; }
    h+='</tbody></table>';
    box.innerHTML=`${parsed.length>1?`<div class="sheet-tabs">${parsed.map((s,j)=>`<button type="button" class="${j===k?'on':''}" data-sheet="${j}">${esc(s.name)}</button>`).join('')}</div>`:''}<div class="sheet-wrap">${h}</div>`;
    box.querySelectorAll('[data-sheet]').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.sheet)));
  };
  show(0);
}

async function renderPptx(box,buf){

  box.innerHTML=`<div class="pptx-deck"></div>`; const deck=box.firstChild;

    const masterPath=Object.values(lrels).find(r=>/slideMaster/.test(r.type)); const mrels=masterPath?await readRels(z,masterPath.target):{};
    const themePath=Object.values(mrels).find(r=>/theme/.test(r.type)); const theme=await readTheme(z,themePath&&themePath.target);
    const mdoc=masterPath?await z.xml(masterPath.target):null; const ldoc=layoutPath?await z.xml(layoutPath.target):null;
    const cmapEl=X1(mdoc,'clrMap'); const cmap={}; if(cmapEl) Array.from(cmapEl.attributes).forEach(a=>cmap[a.name]=a.value);
    const col=el=>dmlColor(el,theme,cmap);
    const sdef=name=>{ const lv=X1(X1(X1(mdoc,'txStyles'),name),'lvl1pPr'); const dr=lv&&kid(lv,'defRPr'); return {color:dr?col(kid(dr,'solidFill')):null,sz:dr&&dr.getAttribute('sz')}; };
    const MD={title:sdef('titleStyle'),body:sdef('bodyStyle'),other:sdef('otherStyle')};
    const bgOf=async(d,rl)=>{ const bg=X1(d,'bg'); if(!bg) return null; const pr=X1(bg,'bgPr'); if(!pr) return null; const sf=kid(pr,'solidFill'); if(sf) return {color:col(sf)};
      const bf=kid(pr,'blipFill'); if(bf){ const id=relAttr(X1(bf,'blip'),'embed'); const r=rl[id]; if(r) return {img:await imgUrl(r.target)}; } return null; };
    const bg=(await bgOf(doc,rels))||(await bgOf(ldoc,lrels))||(await bgOf(mdoc,mrels))||{color:'#ffffff'};
    const slide=document.createElement('div'); slide.className='pptx-slide'; slide.style.cssText=`width:${W}px;height:${H}px;background:${bg.color||'#fff'}`;
    if(bg.img) slide.style.background=`url("${bg.img}") center/cover`;
    const place=(xfrm,g)=>{ const off=kid(xfrm,'off'), ext=kid(xfrm,'ext'); if(!off||!ext) return null;
      let x=+off.getAttribute('x'), y=+off.getAttribute('y'), w=+ext.getAttribute('cx'), h=+ext.getAttribute('cy');
      x=g.ox+(x-g.cx0)*g.sx; y=g.oy+(y-g.cy0)*g.sy; w*=g.sx; h*=g.sy; return {x,y,w,h,rot:(+xfrm.getAttribute('rot')||0)/60000,flipH:xfrm.getAttribute('flipH')==='1',flipV:xfrm.getAttribute('flipV')==='1'}; };
    const boxStyle=b=>`left:${b.x*k}px;top:${b.y*k}px;width:${Math.max(b.w*k,1)}px;height:${Math.max(b.h*k,1)}px;${b.rot||b.flipH||b.flipV?`transform:rotate(${b.rot}deg)${b.flipH?' scaleX(-1)':''}${b.flipV?' scaleY(-1)':''};`:''}`;
    const runsHtml=(txBody,defColor,defSz)=>{ const bp=kid(txBody,'bodyPr'); const out=[]; const lst=X1(X1(kid(txBody,'lstStyle'),'lvl1pPr'),'defRPr'); if(lst){ defColor=col(kid(lst,'solidFill'))||defColor; defSz=lst.getAttribute('sz')||defSz; }
      kids(txBody,'p').forEach(p=>{ const ppr=kid(p,'pPr'); const algn=ppr&&ppr.getAttribute('algn'); let line='';

          const s=(rp&&rp.getAttribute('sz'))||defSz||1800; css.push(`font-size:${(+s/100)*12700*k}px`);
          if(rp&&rp.getAttribute('b')==='1') css.push('font-weight:700'); if(rp&&rp.getAttribute('i')==='1') css.push('font-style:italic');
          const c=rp&&col(kid(rp,'solidFill')); css.push('color:'+(c||defColor||'#000'));
          const latin=rp&&kid(rp,'latin'); if(latin&&latin.getAttribute('typeface')&&!/^\+/.test(latin.getAttribute('typeface'))) css.push(`font-family:'${latin.getAttribute('typeface').replace(/'/g,'')}',var(--f-body)`);
          if(rp&&rp.getAttribute('cap')==='all') css.push('text-transform:uppercase'); if(rp&&rp.getAttribute('spc')) css.push(`letter-spacing:${(+rp.getAttribute('spc')/100)*12700*k}px`);
          line+=`<span style="${css.join(';')}">${esc(tx.textContent)}</span>`; });
        const bu=ppr&&kid(ppr,'buChar'); const ls=ppr&&X1(kid(ppr,'lnSpc'),'spcPct');
        out.push(`<p style="text-align:${{ctr:'center',r:'right',just:'justify'}[algn]||'left'};${ls?`line-height:${(+ls.getAttribute('val')/100000)*1.2}`:''};${!line&&lvlSz?`font-size:${(+lvlSz/100)*12700*k}px`:''}">${bu?`${esc(bu.getAttribute('char'))} `:''}${line||'&nbsp;'}</p>`); });
      const anchor=bp&&bp.getAttribute('anchor'); const ins=n=>bp&&bp.getAttribute(n)!=null?+bp.getAttribute(n)*k:(n==='lIns'||n==='rIns'?91440*k:45720*k);
      return {html:out.join(''),style:`justify-content:${{ctr:'center',b:'flex-end'}[anchor]||'flex-start'};padding:${ins('tIns')}px ${ins('rIns')}px ${ins('bIns')}px ${ins('lIns')}px;${bp&&bp.getAttribute('vert')==='vert270'?'writing-mode:vertical-rl;transform:rotate(180deg);':''}`}; };
    const geomStyle=(spPr)=>{ const css=[]; const pg=kid(spPr,'prstGeom'); const g=pg&&pg.getAttribute('prst');
      const sf=kid(spPr,'solidFill'); if(sf){ const c=col(sf); if(c) css.push('background:'+c); }
      const gf=kid(spPr,'gradFill'); if(gf){ const stops=X(gf,'gs').map(s=>`${col(s)||'transparent'} ${+s.getAttribute('pos')/1000}%`); if(stops.length) css.push(`background:linear-gradient(180deg,${stops.join(',')})`); }
      const ln=kid(spPr,'ln'); if(ln&&!kid(ln,'noFill')){ const lc=col(kid(ln,'solidFill')); const lw=Math.max(1,(+ln.getAttribute('w')||9525)*k); if(lc) css.push(`border:${lw}px ${kid(ln,'prstDash')?'dashed':'solid'} ${lc}`); }

      return {css:css.join(';'),geom:g}; };
    const draw=async(node,g,parent)=>{
      for(const el of Array.from(node.children)){

        if(n==='grpSp'){ const gx=X1(kid(el,'grpSpPr'),'xfrm'); if(!gx){ await draw(el,g,parent); continue; }
          const off=kid(gx,'off'), ext=kid(gx,'ext'), choff=kid(gx,'chOff'), chext=kid(gx,'chExt');
          const b=place(gx,g); const sx=+chext.getAttribute('cx')?(b.w/+chext.getAttribute('cx')):1, sy=+chext.getAttribute('cy')?(b.h/+chext.getAttribute('cy')):1;
          await draw(el,{ox:b.x,oy:b.y,cx0:+choff.getAttribute('x'),cy0:+choff.getAttribute('y'),sx,sy},parent); continue; }
        if(n==='sp'||n==='cxnSp'){ const spPr=kid(el,'spPr'); const xf=X1(spPr,'xfrm'); if(!xf) continue; const b=place(xf,g); if(!b) continue;
          const gs=geomStyle(spPr); const d=document.createElement('div'); d.className='pp-sh'; let st=boxStyle(b)+gs.css;
          if(n==='cxnSp'||gs.geom==='line'||gs.geom==='straightConnector1'){ const ln=kid(spPr,'ln'); const lc=col(kid(ln,'solidFill'))||'#888'; const lw=Math.max(1,(+((ln&&ln.getAttribute('w'))||12700))*k);
            const horiz=b.h*k<2; st=boxStyle(b)+(horiz?`border-top:${lw}px solid ${lc};height:0;`:`border-left:${lw}px solid ${lc};width:0;`); }
          const ph=X1(kid(el,'nvSpPr'),'ph'); const pt=ph?(/title/i.test(ph.getAttribute('type')||'')?'title':'body'):'other';
          const style=kid(el,'style'); let defColor=MD[pt].color; if(style){ const fr=X1(style,'fontRef'); if(fr&&col(fr)) defColor=col(fr); }
          const tx=kid(el,'txBody'); if(tx){ const r=runsHtml(tx,defColor,MD[pt].sz); d.innerHTML=`<div class="pp-tx" style="${r.style}">${r.html}</div>`; }

/* ================= prioritization (criteria from «Критерии приоритезации процессов.xlsx») ================= */
const PRIO_CRIT=[
  {k:'c1',w:0.30,name:'Внедрение/изменение процесса попадает под требования регулятора',desc:'Существует ли нормативное или регуляторное требование (закон, отраслевой стандарт, предписание надзорного органа), обязывающее описать процесс, и установлен ли срок исполнения этого требования'},
  {k:'c2',w:0.20,name:'Критичность для клиента / бизнес-результата',desc:'Насколько прямо процесс влияет на внешнего клиента, ключевой продукт/услугу или достижение стратегической цели организации'},
  {k:'c3',w:0.15,name:'По процессу зафиксирован бизнес-критичный инцидент',desc:'Наличие за отчётный период инцидентов, сбоев, жалоб или споров, связанных с процессом и повлекших значимый ущерб (финансовый, операционный, репутационный)'},
  {k:'c4',w:0.10,name:'Процесс запускается впервые и требуется описание для запуска',desc:'Является ли процесс новым (новый продукт, услуга, канал, подразделение) и выступает ли описание обязательным условием его ввода в эксплуатацию'},
  {k:'c5',w:0.10,name:'Процесс необходим для реализации проекта',desc:'Является ли описание процесса обязательным входом или условием для проекта из утверждённого плана (автоматизация, цифровизация, реорганизация, запуск продукта)'},
  {k:'c6',w:0.05,name:'Частота выполнения и масштаб охвата',desc:'Как часто выполняется процесс и сколько сотрудников, подразделений и систем в нём задействовано'},
  {k:'c7',w:0.05,name:'Потенциал оптимизации и автоматизации',desc:'Ожидаемый эффект от описания: устранение дублирования и потерь, использование как основы для автоматизации/цифровизации'},
  {k:'c8',w:0.05,name:'Кросс-функциональность',desc:'Количество подразделений — участников процесса и число точек передачи ответственности между ними'},
];
const PRIO_SCALE=['Влияние отсутствует или минимально','Влияние незначительное, ограничено одним подразделением','Умеренное влияние, заметно на уровне функции/дирекции','Существенное влияние на уровне организации','Критическое влияние: стратегия, регуляторные обязательства, ключевой клиентский результат'];
const PRIO_CAT={high:{name:'I — высокий приоритет',range:'более 2',term:'До конца 2026 года',ex:'Ключевой клиентский процесс с регуляторными требованиями'},
  mid:{name:'II — средний приоритет',range:'от 1 до 2',term:'В течение 6–12 месяцев',ex:'Внутренний процесс поддержки с умеренным охватом'},
  low:{name:'III — низкий приоритет',range:'от 0 до 1',term:'По запросу либо в плановые окна следующих периодов',ex:'Локальный процесс с ограниченным влиянием'}};
function prioTotal(scores){ return Math.round(PRIO_CRIT.reduce((a,c)=>a+c.w*(+scores[c.k]||0),0)*100)/100; }
const prioOf=total=>total<=1?'low':total<=2?'mid':'high';
const fmtScore=v=>(Math.round(v*100)/100).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
function prioBadge(p){ const v=priOf(p); if(!v) return `<span class="prio-b prio-none" title="${t('Приоритет не задан')}">—</span>`; return `<span class="prio-b prio-${v}" title="${esc(t(PRIO_CAT[v].name))}">${lbl(PRIO_P,v)}</span>`; }
function prioScoreNote(p){ return p.prio&&p.prio.total!=null?`<span class="prio-note">${t('балл')} ${fmtScore(p.prio.total)}${p.prio.at?' · '+fmtDate(p.prio.at):''}</span>`:''; }

function fillPrio(){

function cvApply(id){ const w=document.getElementById(id); if(!w) return; const st=cvState(id); const g=w.querySelector('.cv-stage'); if(g) g.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.k})`; const z=w.querySelector('.cv-zoom'); if(z) z.textContent=Math.round(st.k*100)+'%'; }

  const st=cvState(id); const W=v.clientWidth, H=v.clientHeight; st.k=Math.max(minK||(id==='org-cv'?.75:.45),Math.min(1.1,Math.min((W-40)/bw,(H-40)/bh))); st.x=Math.max(20,(W-bw*st.k)/2); st.y=bh*st.k>H-40?(g.dataset.cy?H/2-(+g.dataset.cy)*st.k:20):(H-bh*st.k)/2; st.fitted=true; cvApply(id); }
function cvZoom(id,f,cx,cy){ const w=document.getElementById(id); if(!w) return; const v=w.querySelector('.cv-view'); const st=cvState(id); const r=v.getBoundingClientRect();
  if(cx==null){ cx=r.width/2; cy=r.height/2; } const k2=Math.max(.2,Math.min(2.5,st.k*f)); st.x=cx-(cx-st.x)*k2/st.k; st.y=cy-(cy-st.y)*k2/st.k; st.k=k2; cvApply(id); }
const cvPt=(id,e)=>{ const w=document.getElementById(id); const r=w.querySelector('.cv-view').getBoundingClientRect(); const st=cvState(id); return {x:(e.clientX-r.left-st.x)/st.k,y:(e.clientY-r.top-st.y)/st.k}; };
(function(){ let pan=null;
  document.addEventListener('pointerdown',e=>{ const v=e.target.closest&&e.target.closest('.cv-view'); if(!v||e.button!==0) return;
    if(e.target.closest('.mm-node,.mp-node,.mp-handle,.mm-tools,.mp-edge-hit,button,input')) return;
    const id=v.parentElement.id; const st=cvState(id); pan={id,x:e.clientX,y:e.clientY,sx:st.x,sy:st.y,moved:false}; v.setPointerCapture(e.pointerId); v.classList.add('panning'); });
  document.addEventListener('pointermove',e=>{ if(!pan) return; const st=cvState(pan.id); st.x=pan.sx+e.clientX-pan.x; st.y=pan.sy+e.clientY-pan.y; if(Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)>3) pan.moved=true; cvApply(pan.id); });
  const end=e=>{ if(!pan) return; const v=document.querySelector('#'+pan.id+' .cv-view'); if(v) v.classList.remove('panning');
    if(!pan.moved){ if(pan.id==='org-cv'&&S.mmSel){ S.mmSel=null; fillOrgMap(); } if(pan.id==='map-cv'&&(S.mapSel||S.mapEdge)){ S.mapSel=null; S.mapEdge=null; fillMap(); } } pan=null; };

function mdLite(tx){

/* quote-aware TSV/CSV parser: Excel puts multi-line cells in quotes */
function parseSheet(text){
  text=String(text||'').replace(/\r\n?/g,'\n');
  const sep=text.includes('\t')?'\t':';';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; continue; }
    if(c==='"'&&cell==='') q=true;
    else if(c===sep){ row.push(cell.trim()); cell=''; }
    else if(c==='\n'){ row.push(cell.trim()); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell.trim()); rows.push(row); }
  return rows.filter(r=>r.some(x=>x));
}
function matchStatus(list,v){
  v=String(v||'').trim().toLowerCase(); if(!v) return 'none';
  const hit=list.find(x=>x.id===v||x.label.toLowerCase()===v||String(EN[x.label]||'').toLowerCase()===v)
    ||list.find(x=>v.length>=4&&(x.label.toLowerCase().startsWith(v.slice(0,5))||String(EN[x.label]||'').toLowerCase().startsWith(v.slice(0,5))));
  return hit?hit.id:'none';

const LINK_RE=/ссылк|link|storm|шторм|url/i, CNT_RE=/кол-?во|количеств|count|число|^n\b/i;
const REG_HDR={code:[/^(id|ид)\b|^id процесса|^process id/i],dept:[/подраздел|department/i],name:[/наименован|назван|^name/i],descPriority:[/приоритет|priority/i],level:[/уровень|level/i],
  parentCode:[/родител|parent/i],nextCodes:[/следующ|next/i],asisStatus:[/as[\s-]?is/i,LINK_RE],tobeStatus:[/to[\s-]?be/i,LINK_RE],owner:[/владел|owner/i],trigger:[/триггер|trigger/i],automation:[/автоматиз|automation/i,/статус|status/i],autoStatus:[/статус автоматиз|automation status|^brd/i],
  core:[/ядро|ключев|core/i],cashFlow:[/движени\S*\s*(дс|ден)|денежн|cash\s*flow/i],scope:[/global|local|глобал|локал|охват|scope/i],stormAsis:[/as[\s-]?is/i,null,LINK_RE],stormTobe:[/to[\s-]?be/i,null,LINK_RE],functions:[/функци|function/i,CNT_RE],fnCount:[/функци|function/i,null,CNT_RE]};
function registryRowsFromSheet(rows){
  const pmap=v=>{v=String(v||'').trim().toLowerCase(); if(!v) return ''; return /^(выс|high|i$|1$)/.test(v)?'high':/^(низ|low|iii$|3$)/.test(v)?'low':/^(сред|mid|medium|ii$|2$)/.test(v)?'mid':'';};
  const st=(list,v)=>String(v||'').trim()?matchStatus(list,v):'';
  // default column order = registry order; a header row (in any order) overrides it
  let idx={}; REG_FILE.forEach(([k],i)=>{ if(k!=='updatedAt') idx[k]=i; });
  if(rows.length){ const h=rows[0].map(x=>String(x||'').trim()); const m={};
    Object.entries(REG_HDR).forEach(([k,[re,not,must]])=>{ const i=h.findIndex(x=>re.test(x)&&!(not&&not.test(x))&&(!must||must.test(x))); if(i>=0) m[k]=i; });
    if(Object.keys(m).length>=3){ idx=m; rows=rows.slice(1); } }
  const g=(r,k)=>idx[k]==null?'':String(r[idx[k]]==null?'':r[idx[k]]).replace(/\s+/g,' ').trim();
  return rows.map(r=>({code:g(r,'code'),dept:g(r,'dept'),name:g(r,'name'),descPriority:pmap(g(r,'descPriority')),level:normLevel(g(r,'level')),parentCode:g(r,'parentCode'),
    asisStatus:st(ASIS_ST,g(r,'asisStatus')),tobeStatus:st(TOBE_ST,g(r,'tobeStatus')),autoStatus:st(AUTO_ST,g(r,'autoStatus')),cashFlow:g(r,'cashFlow'),owner:g(r,'owner'),trigger:g(r,'trigger'),automation:g(r,'automation'),
    core:g(r,'core')?(toBool(g(r,'core'))?'1':'0'):'',scope:(/glob|глоб/i.test(g(r,'scope'))?'global':/loc|лок/i.test(g(r,'scope'))?'local':''),
    stormAsis:g(r,'stormAsis'),stormTobe:g(r,'stormTobe'),fnCount:(g(r,'fnCount').match(/\d+/)||[''])[0],nextCodes:g(r,'nextCodes'),functions:idx.functions==null?'':String(r[idx.functions]==null?'':r[idx.functions]).split(/\s*[;,\n]\s*/).filter(Boolean)})).filter(r=>r.code||r.name);
}

function cfCell(p) {

}

/* ---------- п. 3: группа потока и новая карта процессов ---------- */
const MAP_GROUPS = [{ id: 'mgmt', label: 'Управляющие' }, { id: 'core', label: 'Основные' }, { id: 'support', label: 'Обеспечивающие' }];
function mapGroupCell(p) {
  if (S.me.canEdit) return pfSelect(p, 'mapGroup', 'Группа на карте процессов', [['', '—'], ...MAP_GROUPS.map(g => [g.id, t(g.label)])], p.mapGroup || '');
  return esc(lbl(MAP_GROUPS, p.mapGroup || '')) || '';
}
function pmDesc(p) { // все вложенные процессы (без повторов, защита от циклов)
  const seen = new Set([p.id]), st = [...kidsOf(p)], out = [];
  while (st.length) { const x = st.pop(); if (seen.has(x.id)) continue; seen.add(x.id); out.push(x); st.push(...kidsOf(x)); }
  return out;
}
function pmStreams() {
  let tops = S.procs.filter(p => normLevel(p.level) === '0');
  if (!tops.length) tops = S.procs.filter(p => !parentsOf(p).length && kidsOf(p).length);
  return tops.slice().sort(byCode);
}
function pmChainOrder(list) { // основные потоки — по связям «далее идёт», иначе по ID
  const ids = new Set(list.map(p => p.id)), indeg = new Map(list.map(p => [p.id, 0]));
  list.forEach(p => nextOf(p).forEach(n => { if (ids.has(n.id)) indeg.set(n.id, indeg.get(n.id) + 1); }));
  const out = [], ready = list.filter(p => !indeg.get(p.id)).sort(byCode), used = new Set();
  while (ready.length) { const p = ready.shift(); if (used.has(p.id)) continue; used.add(p.id); out.push(p);
    nextOf(p).filter(n => ids.has(n.id)).sort(byCode).forEach(n => { indeg.set(n.id, indeg.get(n.id) - 1); if (indeg.get(n.id) <= 0) ready.push(n); }); }
  list.slice().sort(byCode).forEach(p => { if (!used.has(p.id)) out.push(p); });
  return out;
}

}

function resField(el) {

  if (['fot', 'hours', 'hm', 'dur', 'rate'].includes(f)) v = v === '' ? (f === 'hours' ? 0 : f === 'hm' ? 165 : null) : (Number(v.replace(',', '.').replace(/\s/g, '')) || 0);
  resEdit(key, r => { if (rk.length === 1) { r[f] = v; return; } const it = r.roles.find(x => x.id === rk[1]); if (it) it[f] = v; });
}
function lcleanRes(d) {
  d = lobj(d) ? d : {};
  const roles = (Array.isArray(d.roles) ? d.roles : []).slice(0, 100).filter(lobj).map(r => ({ id: /^[A-Za-z0-9_-]{6,48}$/.test(r.id || '') ? r.id : lid(), name: lstr(r.name, 200),
    rate: r.rate === '' || r.rate == null ? null : lnum(r.rate, 0, 1e7, null),
    fot: r.fot === '' || r.fot == null ? null : lnum(r.fot, 0, 1e9, null), hours: lnum(r.hours, 0, 100000, 0), hm: r.hm == null || r.hm === '' ? 165 : lnum(r.hm, 1, 744, 165) }));
  return { roles, dur: d.dur === '' || d.dur == null ? null : lnum(d.dur, 0, 1e6, null), durUnit: ['h', 'wd', 'cd'].includes(d.durUnit) ? d.durUnit : 'wd', at: lnow() };
}

/* ---------- события новых элементов ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('[data-act^="ax-"]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const act = b.dataset.act, v = b.dataset.v || '';
  if (act === 'ax-pm-more') { S.pmOpen = S.pmOpen || new Set(); if (S.pmOpen.has(v)) S.pmOpen.delete(v); else S.pmOpen.add(v); fillMap(); return; }
  if (act === 'ax-ready-na') { const [pid, ph, k] = v.split('|'); const p = S.procs.find(x => x.id === pid); if (!p) return; await readySet(pid, ph, k, readyOf(p, ph)[k] === 'na' ? false : 'na'); return; }
  if (act === 'ax-crit-add') { const i = $('#ax-crit-new'); const name = i ? i.value.trim() : ''; if (!name) { if (i) i.focus(); return; } await saveCoreCrit([...coreCrit(), { id: 'c' + lid().slice(0, 10), name }]); return; }
  if (act === 'ax-crit-del') { const list = coreCrit().filter(c => c.id !== v); if (!list.length) { toast(t('Нужен хотя бы один признак.'), true); return; } await saveCoreCrit(list); return; }
}, true);
document.addEventListener('change', async e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.dataset.axReady) { e.stopPropagation(); const [pid, ph, k] = el.dataset.axReady.split('|'); await readySet(pid, ph, k, !!el.checked); return; }
  if (el.dataset.axCritP) { e.stopPropagation(); const [pid, cid] = el.dataset.axCritP.split('|'); const p = S.procs.find(x => x.id === pid); if (!p) return;
    try { await api('PATCH', 'processes/' + pid, { coreCrit: { ...(lobj(p.coreCrit) ? p.coreCrit : {}), [cid]: !!el.checked } }); await load(); toast(t('Отметка сохранена')); } catch (err) { toast(errMsg(err), true); await load(); } return; }
  if (el.dataset.axCritName) { e.stopPropagation(); const name = el.value.trim(); if (!name) { el.value = (coreCrit().find(c => c.id === el.dataset.axCritName) || {}).name || ''; return; }
    await saveCoreCrit(coreCrit().map(c => c.id === el.dataset.axCritName ? { ...c, name } : c)); return; }
}, true);
let pmQT = null;
document.addEventListener('input', e => { if (e.target && e.target.id === 'pm-q') { clearTimeout(pmQT); const val = e.target.value; pmQT = setTimeout(() => { S.mapQ = val; fillMap(); }, 200); } }, true);
/* ================= конец доработок аналитика ================= */

boot();
